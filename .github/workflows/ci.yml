name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./boilerplate-cli-ui-zig version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./boilerplate-cli-ui-zig version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
